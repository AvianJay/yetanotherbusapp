name: Build

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.41.6
  APP_REPO_OWNER: ${{ github.repository_owner }}
  APP_REPO_NAME: yetanotherbusapp
  APP_WORKFLOW_API_ID: build.yml
  APP_WORKFLOW_NIGHTLY_ID: build
  APP_UPDATE_CHANNEL: nightly
  IOS_FLAVOR: YABus
  YABUS_GOOGLE_WEB_CLIENT_ID: ${{ secrets.YABUS_GOOGLE_WEB_CLIENT_ID }}
  YABUS_GOOGLE_IOS_CLIENT_ID: ${{ secrets.YABUS_GOOGLE_IOS_CLIENT_ID }}

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    needs: verify

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Prepare Android signing files
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [[ -n "$KEYSTORE_BASE64" && -n "$KEYSTORE_ALIAS" && -n "$KEYSTORE_PASSWORD" ]]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
            printf '%s\n' \
              "storePassword=$KEYSTORE_PASSWORD" \
              "keyPassword=$KEYSTORE_PASSWORD" \
              "keyAlias=$KEYSTORE_ALIAS" \
              "storeFile=upload-keystore.jks" \
              > android/key.properties
          else
            echo "Signing secrets are missing; skip generating release keystore files."
          fi

      - name: Print signing mode
        shell: bash
        run: |
          if [[ -f android/key.properties ]]; then
            echo "Using configured release keystore."
          else
            echo "No signing secrets available; falling back to debug signing."
          fi

      - name: Build APK
        env:
          APP_GIT_SHA: ${{ github.sha }}
        run: >
          flutter build apk --release
          --dart-define=APP_GIT_SHA=${{ github.sha }}
          --dart-define=APP_UPDATE_CHANNEL=${{ env.APP_UPDATE_CHANNEL }}
          --dart-define=APP_REPO_OWNER=${{ env.APP_REPO_OWNER }}
          --dart-define=APP_REPO_NAME=${{ env.APP_REPO_NAME }}
          --dart-define=APP_WORKFLOW_API_ID=${{ env.APP_WORKFLOW_API_ID }}
          --dart-define=APP_WORKFLOW_NIGHTLY_ID=${{ env.APP_WORKFLOW_NIGHTLY_ID }}
          --dart-define=YABUS_GOOGLE_WEB_CLIENT_ID=${{ env.YABUS_GOOGLE_WEB_CLIENT_ID }}
          --dart-define=YABUS_GOOGLE_IOS_CLIENT_ID=${{ env.YABUS_GOOGLE_IOS_CLIENT_ID }}
          --dart-define=APP_NIGHTLY_ARTIFACT=android-apk-release

      - name: Upload Android artifact
        uses: actions/upload-artifact@v6
        with:
          name: android-apk-release
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Build AAB
        env:
          APP_GIT_SHA: ${{ github.sha }}
          APP_BUILD_AAB: "true"
        run: >
          flutter build appbundle --release
          --dart-define=APP_GIT_SHA=${{ github.sha }}
          --dart-define=APP_UPDATE_CHANNEL=${{ env.APP_UPDATE_CHANNEL }}
          --dart-define=APP_REPO_OWNER=${{ env.APP_REPO_OWNER }}
          --dart-define=APP_REPO_NAME=${{ env.APP_REPO_NAME }}
          --dart-define=APP_WORKFLOW_API_ID=${{ env.APP_WORKFLOW_API_ID }}
          --dart-define=APP_WORKFLOW_NIGHTLY_ID=${{ env.APP_WORKFLOW_NIGHTLY_ID }}
          --dart-define=YABUS_GOOGLE_WEB_CLIENT_ID=${{ env.YABUS_GOOGLE_WEB_CLIENT_ID }}
          --dart-define=YABUS_GOOGLE_IOS_CLIENT_ID=${{ env.YABUS_GOOGLE_IOS_CLIENT_ID }}
          --dart-define=APP_NIGHTLY_ARTIFACT=android-aab-release
          --dart-define=APP_BUILD_AAB=true

      - name: Upload Android AppBundle artifact
        uses: actions/upload-artifact@v6
        with:
          name: android-aab-release
          path: build/app/outputs/bundle/release/app-release.aab

  build-wearos:
    name: Build Wear OS APK
    runs-on: ubuntu-latest
    needs: verify

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Prepare Wear OS signing files
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [[ -n "$KEYSTORE_BASE64" && -n "$KEYSTORE_ALIAS" && -n "$KEYSTORE_PASSWORD" ]]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > android/wearos/upload-keystore.jks
            printf '%s\n' \
              "storePassword=$KEYSTORE_PASSWORD" \
              "keyPassword=$KEYSTORE_PASSWORD" \
              "keyAlias=$KEYSTORE_ALIAS" \
              "storeFile=upload-keystore.jks" \
              > android/wearos/key.properties
          else
            echo "Signing secrets are missing; skip generating release keystore files."
          fi

      - name: Print signing mode
        shell: bash
        run: |
          if [[ -f android/wearos/key.properties ]]; then
            echo "Using configured release keystore for Wear OS."
          else
            echo "No signing secrets available; falling back to debug signing for Wear OS."
          fi

      - name: Generate Gradle files
        run: flutter build apk --config-only

      - name: Create local.properties for Wear OS
        shell: bash
        run: |
          FLUTTER_BIN=$(which flutter)
          FLUTTER_SDK=$(dirname $(dirname "$FLUTTER_BIN"))
          echo "flutter.sdk=$FLUTTER_SDK" > android/wearos/local.properties
          cat android/wearos/local.properties

      - name: Build Wear OS APK and AAB
        env:
          APP_GIT_SHA: ${{ github.sha }}
        run: |
          cd android
          ./gradlew :wearos:assembleRelease :wearos:bundleRelease

      - name: Upload Wear OS APK artifact
        uses: actions/upload-artifact@v6
        with:
          name: wearos-apk-release
          path: build/wearos/outputs/apk/release/wearos-release.apk

      - name: Upload Wear OS AppBundle artifact
        uses: actions/upload-artifact@v6
        with:
          name: wearos-aab-release
          path: build/wearos/outputs/bundle/release/wearos-release.aab

  build-web:
    name: Build Web
    runs-on: ubuntu-latest
    needs: verify

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Web
        run: >
          flutter build web --release
          --dart-define=APP_GIT_SHA=${{ github.sha }}
          --dart-define=APP_UPDATE_CHANNEL=${{ env.APP_UPDATE_CHANNEL }}
          --dart-define=APP_REPO_OWNER=${{ env.APP_REPO_OWNER }}
          --dart-define=APP_REPO_NAME=${{ env.APP_REPO_NAME }}
          --dart-define=APP_WORKFLOW_API_ID=${{ env.APP_WORKFLOW_API_ID }}
          --dart-define=APP_WORKFLOW_NIGHTLY_ID=${{ env.APP_WORKFLOW_NIGHTLY_ID }}
          --dart-define=YABUS_GOOGLE_WEB_CLIENT_ID=${{ env.YABUS_GOOGLE_WEB_CLIENT_ID }}
          --dart-define=YABUS_GOOGLE_IOS_CLIENT_ID=${{ env.YABUS_GOOGLE_IOS_CLIENT_ID }}
          --dart-define=APP_NIGHTLY_ARTIFACT=web-release

      - name: Stamp web build (sw.js cache version + version.json)
        shell: bash
        env:
          APP_VERSION: nightly
          APP_BUILD_NUMBER: ${{ github.run_number }}
          APP_GIT_SHA: ${{ github.sha }}
        run: node scripts/stamp-web-build.mjs

      - name: Upload Web artifact
        uses: actions/upload-artifact@v6
        with:
          name: web-release
          path: build/web

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    needs: verify

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows
        run: >
          flutter build windows --release
          --dart-define=APP_GIT_SHA=${{ github.sha }}
          --dart-define=APP_UPDATE_CHANNEL=${{ env.APP_UPDATE_CHANNEL }}
          --dart-define=APP_REPO_OWNER=${{ env.APP_REPO_OWNER }}
          --dart-define=APP_REPO_NAME=${{ env.APP_REPO_NAME }}
          --dart-define=APP_WORKFLOW_API_ID=${{ env.APP_WORKFLOW_API_ID }}
          --dart-define=APP_WORKFLOW_NIGHTLY_ID=${{ env.APP_WORKFLOW_NIGHTLY_ID }}
          --dart-define=YABUS_GOOGLE_WEB_CLIENT_ID=${{ env.YABUS_GOOGLE_WEB_CLIENT_ID }}
          --dart-define=YABUS_GOOGLE_IOS_CLIENT_ID=${{ env.YABUS_GOOGLE_IOS_CLIENT_ID }}
          --dart-define=APP_NIGHTLY_ARTIFACT=windows-release

      - name: Install NSIS
        shell: pwsh
        run: |
          choco install nsis -y
          $nsisExe = Join-Path ${env:ProgramFiles(x86)} 'NSIS\makensis.exe'
          if (-not (Test-Path $nsisExe)) {
            throw "makensis.exe not found at $nsisExe"
          }
          & $nsisExe /VERSION

      - name: Build Windows installer
        shell: pwsh
        run: |
          $nsisExe = Join-Path ${env:ProgramFiles(x86)} 'NSIS\makensis.exe'
          $sourceDir = Join-Path $env:GITHUB_WORKSPACE 'build\windows\x64\runner\Release'
          if (-not (Test-Path $nsisExe)) {
            throw "makensis.exe not found at $nsisExe"
          }
          if (-not (Test-Path $sourceDir)) {
            throw "Windows build output not found at $sourceDir"
          }
          & $nsisExe `
            "/DVERSION=nightly-${{ github.run_number }}" `
            "/DSOURCE_DIR=$sourceDir" `
            windows\installer\yabus.nsi

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v6
        with:
          name: windows-release
          path: windows/installer/YABus-nightly-${{ github.run_number }}-windows-x64-setup.exe

  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    needs: verify

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libnotify-dev dpkg-dev

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Enable Linux desktop
        run: flutter config --enable-linux-desktop

      - name: Install dependencies
        run: flutter pub get

      - name: Build Linux
        run: >
          flutter build linux --release
          --dart-define=APP_GIT_SHA=${{ github.sha }}
          --dart-define=APP_UPDATE_CHANNEL=${{ env.APP_UPDATE_CHANNEL }}
          --dart-define=APP_REPO_OWNER=${{ env.APP_REPO_OWNER }}
          --dart-define=APP_REPO_NAME=${{ env.APP_REPO_NAME }}
          --dart-define=APP_WORKFLOW_API_ID=${{ env.APP_WORKFLOW_API_ID }}
          --dart-define=APP_WORKFLOW_NIGHTLY_ID=${{ env.APP_WORKFLOW_NIGHTLY_ID }}
          --dart-define=YABUS_GOOGLE_WEB_CLIENT_ID=${{ env.YABUS_GOOGLE_WEB_CLIENT_ID }}
          --dart-define=YABUS_GOOGLE_IOS_CLIENT_ID=${{ env.YABUS_GOOGLE_IOS_CLIENT_ID }}
          --dart-define=APP_NIGHTLY_ARTIFACT=linux-release

      - name: Package Linux installers
        shell: bash
        run: |
          chmod +x linux/installer/create_linux_packages.sh
          bash linux/installer/create_linux_packages.sh \
            build/linux/x64/release/bundle \
            nightly-${{ github.run_number }} \
            build/linux/output

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v6
        with:
          name: linux-release
          path: build/linux/output

  build-macos:
    name: Build macOS
    runs-on: macos-latest
    needs: verify

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Enable macOS desktop
        run: flutter config --enable-macos-desktop

      - name: Install dependencies
        run: flutter pub get

      - name: Build macOS
        run: >
          flutter build macos --release
          --dart-define=APP_GIT_SHA=${{ github.sha }}
          --dart-define=APP_UPDATE_CHANNEL=${{ env.APP_UPDATE_CHANNEL }}
          --dart-define=APP_REPO_OWNER=${{ env.APP_REPO_OWNER }}
          --dart-define=APP_REPO_NAME=${{ env.APP_REPO_NAME }}
          --dart-define=APP_WORKFLOW_API_ID=${{ env.APP_WORKFLOW_API_ID }}
          --dart-define=APP_WORKFLOW_NIGHTLY_ID=${{ env.APP_WORKFLOW_NIGHTLY_ID }}
          --dart-define=YABUS_GOOGLE_WEB_CLIENT_ID=${{ env.YABUS_GOOGLE_WEB_CLIENT_ID }}
          --dart-define=YABUS_GOOGLE_IOS_CLIENT_ID=${{ env.YABUS_GOOGLE_IOS_CLIENT_ID }}
          --dart-define=APP_NIGHTLY_ARTIFACT=macos-release

      - name: Package macOS DMG
        shell: bash
        run: |
          APP_PATH=$(find build/macos/Build/Products/Release -maxdepth 1 -name "*.app" -type d | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "No macOS .app bundle found."
            exit 1
          fi
          mkdir -p build/macos/output
          chmod +x macos/installer/create_dmg.sh
          bash macos/installer/create_dmg.sh "$APP_PATH" nightly-${{ github.run_number }} build/macos/output

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v6
        with:
          name: macos-release
          path: build/macos/output/YABus-nightly-${{ github.run_number }}-macos.dmg

  build-ios-ipa:
    name: Build iOS unsigned IPA
    runs-on: macos-latest
    needs: verify

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Prepare iOS build
        run: flutter precache --ios

      - name: Generate iOS archive without codesign
        env:
          APP_GIT_SHA: ${{ github.sha }}
        run: >
          flutter build ios --release --no-codesign
          --flavor=${{ env.IOS_FLAVOR }}
          --dart-define=APP_GIT_SHA=${{ github.sha }}
          --dart-define=APP_UPDATE_CHANNEL=${{ env.APP_UPDATE_CHANNEL }}
          --dart-define=APP_REPO_OWNER=${{ env.APP_REPO_OWNER }}
          --dart-define=APP_REPO_NAME=${{ env.APP_REPO_NAME }}
          --dart-define=APP_WORKFLOW_API_ID=${{ env.APP_WORKFLOW_API_ID }}
          --dart-define=APP_WORKFLOW_NIGHTLY_ID=${{ env.APP_WORKFLOW_NIGHTLY_ID }}
          --dart-define=YABUS_GOOGLE_WEB_CLIENT_ID=${{ env.YABUS_GOOGLE_WEB_CLIENT_ID }}
          --dart-define=YABUS_GOOGLE_IOS_CLIENT_ID=${{ env.YABUS_GOOGLE_IOS_CLIENT_ID }}
          --dart-define=APP_NIGHTLY_ARTIFACT=ios-unsigned-ipa

      - name: Archive YABus.app
        env:
          APP_GIT_SHA: ${{ github.sha }}
        run: |
          xcodebuild \
            -workspace ios/YABus.xcworkspace \
            -scheme ${{ env.IOS_FLAVOR }} \
            -configuration Release-${{ env.IOS_FLAVOR }} \
            -sdk iphoneos \
            -destination generic/platform=iOS \
            -archivePath build/ipa/YABus.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_IDENTITY="" \
            archive

      - name: Package unsigned IPA
        run: |
          mkdir -p build/ipa/temp/Payload
          mv build/ipa/*.xcarchive/Products/Applications/*.app build/ipa/temp/Payload/
          rm -rf build/ipa/*.xcarchive
          cd build/ipa/temp
          zip -r Generated_IPA.zip Payload
          mv Generated_IPA.zip ../Generated_IPA.ipa
          cd ../../..
          rm -rf build/ipa/temp

      - name: Upload iOS artifact
        uses: actions/upload-artifact@v6
        with:
          name: ios-unsigned-ipa
          path: build/ipa/Generated_IPA.ipa

  publish-nightly:
    name: Publish Nightly
    runs-on: ubuntu-latest
    needs:
      - build-android
      - build-wearos
      - build-web
      - build-windows
      - build-linux
      - build-macos
      - build-ios-ipa
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v6
        with:
          path: nightly-artifacts
          pattern: '*-release'

      - name: Publish rolling nightly release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rolling_marker='YABUS_ROLLING_NIGHTLY'
          new_tag="nightly-$GITHUB_SHA"
          short_sha="${GITHUB_SHA::7}"
          mkdir -p nightly-release
          release_files=()
          expected_asset_names=()

          add_asset() {
            local source="$1"
            local target="$2"
            if [[ -n "$source" ]]; then
              cp "$source" "nightly-release/$target"
              release_files+=("nightly-release/$target")
              expected_asset_names+=("$target")
            fi
          }

          add_asset "$(find nightly-artifacts/android-apk-release -type f -name '*.apk' -print -quit)" "YABus-nightly-$GITHUB_SHA.apk"
          add_asset "$(find nightly-artifacts/windows-release -type f -name '*.exe' -print -quit)" "YABus-nightly-$GITHUB_SHA-windows-x64-setup.exe"
          add_asset "$(find nightly-artifacts/linux-release -type f -name '*.deb' -print -quit)" "YABus-nightly-$GITHUB_SHA-linux-amd64.deb"
          add_asset "$(find nightly-artifacts/linux-release -type f -name '*.AppImage' -print -quit)" "YABus-nightly-$GITHUB_SHA-linux-amd64.AppImage"
          add_asset "$(find nightly-artifacts/macos-release -type f -name '*.dmg' -print -quit)" "YABus-nightly-$GITHUB_SHA-macos.dmg"

          if [[ ${#release_files[@]} -ne 5 ]]; then
            echo "Expected 5 installable nightly assets, found ${#release_files[@]}." >&2
            exit 1
          fi

          release_notes="$(printf '<!-- %s -->\n\nNightly build for commit `%s`.' "$rolling_marker" "$GITHUB_SHA")"
          created_draft=false
          rolling_tag="$(
            gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
              --jq '.[] | select(.prerelease == true and ((.body // "") | contains("YABUS_ROLLING_NIGHTLY"))) | .tag_name' \
              | sed -n '1p'
          )"

          if [[ -z "$rolling_tag" ]]; then
            rolling_tag="$(
              gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
                --jq '.[] | select(.prerelease == true and (.tag_name | test("^nightly-[0-9a-f]{40}$"))) | .tag_name' \
                | sed -n '1p'
            )"
          fi

          if [[ -z "$rolling_tag" ]]; then
            rolling_tag="$new_tag"
            created_draft=true
            gh release create "$rolling_tag" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Nightly $short_sha" \
              --notes "$release_notes" \
              --prerelease \
              --draft
          fi

          release_id_before="$(
            gh release view "$rolling_tag" \
              --repo "$GITHUB_REPOSITORY" \
              --json databaseId \
              --jq '.databaseId'
          )"
          metadata_published=false
          quarantined_asset_urls=()
          quarantined_asset_names=()

          rollback_unpublished_assets() {
            local status="$?"
            if [[ "$status" -eq 0 || "$metadata_published" == true ]]; then
              return
            fi

            echo 'Nightly publish failed before the metadata switch; restoring the previous release.' >&2
            if [[ "$created_draft" == true ]]; then
              gh release delete "$rolling_tag" \
                --repo "$GITHUB_REPOSITORY" \
                --yes \
                --cleanup-tag \
                >/dev/null 2>&1 || true
              return
            fi

            for index in "${!quarantined_asset_urls[@]}"; do
              api_path="${quarantined_asset_urls[$index]#https://api.github.com/}"
              gh api --method PATCH "$api_path" \
                -f name="${quarantined_asset_names[$index]}" \
                >/dev/null 2>&1 || true
            done
            for expected_name in "${expected_asset_names[@]}"; do
              gh release delete-asset "$rolling_tag" "$expected_name" \
                --repo "$GITHUB_REPOSITORY" \
                --yes \
                >/dev/null 2>&1 || true
            done
          }
          trap rollback_unpublished_assets EXIT

          gh release upload "$rolling_tag" "${release_files[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

          assets_json="$(
            gh release view "$rolling_tag" \
              --repo "$GITHUB_REPOSITORY" \
              --json assets
          )"
          for expected_name in "${expected_asset_names[@]}"; do
            jq -e --arg name "$expected_name" \
              '.assets[] | select(.name == $name and .size > 0)' \
              <<<"$assets_json" >/dev/null
          done

          while IFS=$'\t' read -r asset_api_url asset_name; do
            [[ -z "$asset_name" || "$asset_name" != YABus-nightly-* ]] && continue
            keep_asset=false
            for expected_name in "${expected_asset_names[@]}"; do
              if [[ "$asset_name" == "$expected_name" ]]; then
                keep_asset=true
                break
              fi
            done
            if [[ "$keep_asset" == false ]]; then
              backup_name="rollback-$asset_name.bak"
              api_path="${asset_api_url#https://api.github.com/}"
              gh api --method PATCH "$api_path" \
                -f name="$backup_name" \
                >/dev/null
              quarantined_asset_urls+=("$asset_api_url")
              quarantined_asset_names+=("$asset_name")
            fi
          done < <(jq -r '.assets[] | [.apiUrl, .name] | @tsv' <<<"$assets_json")

          if [[ "$rolling_tag" == "$new_tag" ]]; then
            gh release edit "$rolling_tag" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Nightly $short_sha" \
              --notes "$release_notes" \
              --prerelease \
              --draft=false
          else
            gh release edit "$rolling_tag" \
              --repo "$GITHUB_REPOSITORY" \
              --tag "$new_tag" \
              --target "$GITHUB_SHA" \
              --title "Nightly $short_sha" \
              --notes "$release_notes" \
              --prerelease \
              --draft=false
          fi
          metadata_published=true

          for asset_api_url in "${quarantined_asset_urls[@]}"; do
            api_path="${asset_api_url#https://api.github.com/}"
            gh api --method DELETE "$api_path" >/dev/null
          done

          published_json="$(
            gh release view "$new_tag" \
              --repo "$GITHUB_REPOSITORY" \
              --json databaseId,assets
          )"
          release_id_after="$(jq -r '.databaseId' <<<"$published_json")"
          if [[ "$release_id_after" != "$release_id_before" ]]; then
            echo 'Rolling nightly release ID changed unexpectedly.' >&2
            exit 1
          fi

          for expected_name in "${expected_asset_names[@]}"; do
            asset_url="$(
              jq -er --arg name "$expected_name" \
                '.assets[] | select(.name == $name and .size > 0) | .url' \
                <<<"$published_json"
            )"
            curl --fail --silent --show-error --location --head "$asset_url" \
              >/dev/null
          done

          if [[ "$rolling_tag" != "$new_tag" ]]; then
            if gh api --method DELETE \
              "repos/$GITHUB_REPOSITORY/git/refs/tags/$rolling_tag" \
              >/dev/null 2>&1; then
              echo "Removed previous rolling tag $rolling_tag."
            else
              echo "Previous rolling tag $rolling_tag was already absent."
            fi
          fi
